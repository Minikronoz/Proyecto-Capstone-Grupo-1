<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Perfil</title>
  <link rel="stylesheet" href="/css/registrar.css" />
  <script src="/js/regiones.js"></script>

  <script defer>
  document.addEventListener("DOMContentLoaded", async () => {
    const msg = document.getElementById("msg");

    // 🔒 Verificar sesión activa
    try {
      const res = await fetch("/api/sesion-activa", { credentials: "include" });
      if (res.status === 401) {
        alert("Debes iniciar sesión.");
        return (window.location.href = "/login");
      }

      const { user } = await res.json();
      const userId = user.id;
      if (!userId) {
        alert("Debes iniciar sesión.");
        return (window.location.href = "/login");
      }

      await cargarPerfilUsuario(userId);
    } catch (error) {
      console.error("Error verificando sesión:", error);
      alert("Error de sesión. Inicia sesión nuevamente.");
      return (window.location.href = "/login");
    }

    // ==================================================
    // 📋 Cargar perfil del usuario desde MongoDB Atlas
    // ==================================================
    async function cargarPerfilUsuario(userId) {
      const form = document.getElementById("formEditar");
      const regionSelect = document.getElementById("region");
      const comunaSelect = document.getElementById("comuna");
      const sectorSelect = document.getElementById("sector");
      const tieneNegocioCheck = document.getElementById("tieneNegocio");
      const negociosContainer = document.getElementById("negociosContainer");
      const addNegocioBtn = document.getElementById("addNegocioBtn");

      // Poblar regiones
      Object.keys(regiones).forEach(region => {
        const opt = document.createElement("option");
        opt.value = region;
        opt.textContent = region;
        regionSelect.appendChild(opt);
      });

      regionSelect.addEventListener("change", () => {
        comunaSelect.innerHTML = "<option value=''>Seleccione comuna</option>";
        sectorSelect.innerHTML = "<option value=''>Seleccione sector</option>";
        const comunas = regiones[regionSelect.value] || [];
        comunas.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          comunaSelect.appendChild(opt);
        });
      });

      comunaSelect.addEventListener("change", () => {
        sectorSelect.innerHTML = "<option value=''>Seleccione sector</option>";
        const sectores = sectoresPorComuna[comunaSelect.value] || [];
        sectores.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          sectorSelect.appendChild(opt);
        });
      });

      try {
        const res = await fetch(`/api/usuarios/${userId}`, {
          method: "GET",
          headers: { "Accept": "application/json" },
          credentials: "include"
        });
        const u = await res.json();

        document.getElementById("nombre").value = u.nombre || "";
        document.getElementById("apellido").value = u.apellido || "";
        document.getElementById("rut").value = u.rut || "";
        document.getElementById("fechaNacimiento").value = u.fechaNacimiento || "";
        document.getElementById("genero").value = u.genero || "";
        document.getElementById("correo").value = u.correo || "";
        document.getElementById("region").value = u.region || "";
        regionSelect.dispatchEvent(new Event("change"));
        setTimeout(() => {
          document.getElementById("comuna").value = u.comuna || "";
          comunaSelect.dispatchEvent(new Event("change"));
          setTimeout(() => (document.getElementById("sector").value = u.sector || ""), 200);
        }, 200);

        if (u.negocios && u.negocios.length > 0) {
          tieneNegocioCheck.checked = true;
          negociosContainer.style.display = "block";
          u.negocios.forEach((n, i) => crearBloqueNegocio(n, i + 1));
        }
      } catch (err) {
        console.error(err);
        msg.textContent = "❌ Error cargando datos del usuario.";
        msg.className = "error";
      }

      // ==================================================
      // 💾 Guardar cambios
      // ==================================================
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        try {
          const res = await fetch(`/api/usuarios/${userId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
            credentials: "include"
          });

          if (!res.ok) throw new Error("Error al actualizar");

          msg.textContent = "✅ Perfil actualizado correctamente";
          msg.className = "exito";
          setTimeout(() => window.location.href = "/catalogo", 1000);
        } catch (err) {
          msg.textContent = "❌ No se pudo actualizar el perfil";
          msg.className = "error";
        }
      });

      // ==================================================
      // 🧱 Función para crear bloques de negocio dinámicos
      // ==================================================
      function crearBloqueNegocio(n = {}, index) {
        const div = document.createElement("div");
        div.classList.add("negocio-item");
        div.innerHTML = `
          <h4>Negocio ${index}</h4>
          <input type="text" name="nombreNegocio_${index}" value="${n.nombre || ""}" placeholder="Nombre del negocio" required>
          <input type="text" name="rolTributario_${index}" value="${n.rolTributario || ""}" placeholder="Rol Tributario" required>
          <input type="text" name="giro_${index}" value="${n.giro || ""}" placeholder="Giro del negocio" required>
          <button type="button" class="removeNegocioBtn">Eliminar negocio</button>
        `;
        negociosContainer.appendChild(div);
        div.querySelector(".removeNegocioBtn").addEventListener("click", () => div.remove());
      }

      addNegocioBtn.addEventListener("click", () => {
        const i = negociosContainer.querySelectorAll(".negocio-item").length + 1;
        crearBloqueNegocio({}, i);
      });
    }
  });
  </script>
</head>

<body>
  <div class="form-container">
    <h2>Editar Perfil</h2>
    <form id="formEditar">
      <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
      <input type="text" id="apellido" name="apellido" placeholder="Apellido" required>
      <input type="text" id="rut" name="rut" placeholder="RUT" required>
      <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>

      <select id="genero" name="genero" required>
        <option value="">Seleccione género</option>
        <option value="Masculino">Masculino</option>
        <option value="Femenino">Femenino</option>
        <option value="Otro">Otro</option>
      </select>

      <select id="region" name="region" required>
        <option value="">Seleccione región</option>
      </select>

      <select id="comuna" name="comuna" required>
        <option value="">Seleccione comuna</option>
      </select>

      <select id="sector" name="sector" required>
        <option value="">Seleccione sector</option>
      </select>

      <input type="email" id="correo" name="correo" placeholder="Correo electrónico" required disabled>

      <label>
        <input type="checkbox" id="tieneNegocio" name="tieneNegocio"> Tengo negocio(s)
      </label>

      <div id="negociosContainer" style="display:none;">
        <h3>Mis Negocios</h3>
        <button type="button" id="addNegocioBtn" class="btn-secundario">+ Agregar negocio</button>
      </div>

      <p id="msg"></p>
      <button type="submit" class="btn-catalogo">Guardar cambios</button>
      <div class="links">
        <a href="/catalogo">← Volver al catálogo</a>
      </div>
    </form>
  </div>
</body>
</html>
