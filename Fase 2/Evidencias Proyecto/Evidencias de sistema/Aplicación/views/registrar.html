<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Usuario</title>

  <link rel="stylesheet" href="/css/registrar.css" />
  <script src="/js/regiones.js"></script>

  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.querySelector("form");
      const mensaje = document.createElement("p");
      mensaje.id = "mensaje";
      form.appendChild(mensaje);

      const regionSelect = document.getElementById("region");
      const comunaSelect = document.getElementById("comuna");
      const sectorSelect = document.getElementById("sector");
      const tieneNegocioCheck = document.getElementById("tieneNegocio");
      const negociosContainer = document.getElementById("negociosContainer");
      const addNegocioBtn = document.getElementById("addNegocioBtn");

      /* =====================================================
          FUNCIÓN VALIDAR RUT (PERSONA O TRIBUTARIO)
      ===================================================== */
      function validarRutChileno(rutCompleto) {
        if (!rutCompleto) return false;

        rutCompleto = rutCompleto.replace(/\./g, "").replace("-", "").toUpperCase();
        if (!/^[0-9]+[0-9K]$/.test(rutCompleto)) return false;

        const cuerpo = rutCompleto.slice(0, -1);
        const dv = rutCompleto.slice(-1);

        let suma = 0;
        let multiplo = 2;

        for (let i = cuerpo.length - 1; i >= 0; i--) {
          suma += multiplo * parseInt(cuerpo[i]);
          multiplo = multiplo < 7 ? multiplo + 1 : 2;
        }

        const dvEsperado = 11 - (suma % 11);
        const dvFinal =
          dvEsperado === 11 ? "0" : dvEsperado === 10 ? "K" : dvEsperado.toString();

        return dvFinal === dv;
      }

      /* =====================================================
          CARGA REGIONES / COMUNAS / SECTORES
      ===================================================== */
      Object.keys(regiones).forEach(region => {
        const opt = document.createElement("option");
        opt.value = region;
        opt.textContent = region;
        regionSelect.appendChild(opt);
      });

      regionSelect.addEventListener("change", () => {
        comunaSelect.innerHTML = "<option value=''>Seleccione comuna</option>";
        const comunaList = regiones[regionSelect.value] || [];
        comunaList.forEach(c => {
          const o = document.createElement("option");
          o.value = c;
          o.textContent = c;
          comunaSelect.appendChild(o);
        });
      });

      comunaSelect.addEventListener("change", () => {
        sectorSelect.innerHTML = "<option value=''>Seleccione sector</option>";
        const sectores = sectoresPorComuna[comunaSelect.value] || [];
        sectores.forEach(s => {
          const o = document.createElement("option");
          o.value = s;
          o.textContent = s;
          sectorSelect.appendChild(o);
        });
      });

      /* =====================================================
          NEGOCIOS DINÁMICOS
      ===================================================== */
      tieneNegocioCheck.addEventListener("change", e => {
        negociosContainer.style.display = e.target.checked ? "block" : "none";
      });

      addNegocioBtn.addEventListener("click", () => {
        const index = negociosContainer.querySelectorAll(".negocio-item").length + 1;
        const div = document.createElement("div");
        div.classList.add("negocio-item");
        div.innerHTML = `
          <h4>Negocio ${index}</h4>
          <input type="text" class="nombreNegocio" name="nombreNegocio_${index}" placeholder="Nombre del negocio" required>
          <input type="text" class="rolTributario" name="rolTributario_${index}" placeholder="Rol Tributario (RUT)" required>
          <input type="text" name="giro_${index}" placeholder="Giro del negocio" required>
          <input type="text" name="telefonoNegocio_${index}" placeholder="Teléfono (opcional)">
          <input type="email" name="correoNegocio_${index}" placeholder="Correo (opcional)">
          <input type="text" name="webNegocio_${index}" placeholder="Sitio web (opcional)">
          <button type="button" class="removeNegocioBtn">🗑️ Eliminar</button>
        `;
        negociosContainer.appendChild(div);
        div.querySelector(".removeNegocioBtn").addEventListener("click", () => div.remove());
      });

      /* =====================================================
          VALIDACIONES DEL FORMULARIO
      ===================================================== */
      function mostrarError(msg) {
        mensaje.textContent = "❌ " + msg;
        mensaje.style.color = "red";
        mensaje.style.fontWeight = "600";
        mensaje.style.marginTop = "10px";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        mensaje.textContent = "";
        mensaje.style.color = "";

        const nombre = form.nombre.value.trim();
        const apellido = form.apellido.value.trim();
        const rut = form.rut.value.trim();
        const fechaNacimiento = form.fechaNacimiento.value;
        const correo = form.correo.value.trim();
        const contraseña = form.contraseña.value;

        /* ==== VALIDACIONES GENERALES ==== */
        if (!nombre) return mostrarError("Debe ingresar un nombre.");
        if (!apellido) return mostrarError("Debe ingresar un apellido.");
        if (!validarRutChileno(rut)) return mostrarError("El RUT ingresado no es válido.");
        if (!fechaNacimiento) return mostrarError("Debe ingresar su fecha de nacimiento.");

        if (!correo.includes("@") || !correo.includes("."))
          return mostrarError("Debe ingresar un correo válido.");

        if (contraseña.length < 6)
          return mostrarError("La contraseña debe tener al menos 6 caracteres.");

        /* ==== VALIDAR NEGOCIOS ==== */
        if (tieneNegocioCheck.checked) {
          const negocios = document.querySelectorAll(".negocio-item");

          if (negocios.length === 0)
            return mostrarError("Debe agregar al menos un negocio.");

          for (let n of negocios) {
            const nombreNegocio = n.querySelector(".nombreNegocio").value.trim();
            const rutNegocio = n.querySelector(".rolTributario").value.trim();

            if (!nombreNegocio)
              return mostrarError("El nombre del negocio es obligatorio.");

            if (!validarRutChileno(rutNegocio))
              return mostrarError("El Rol Tributario debe ser un RUT válido.");
          }
        }

        /* =====================================================
            SI TODO ES VÁLIDO → ENVIAR A LA BASE DE DATOS
        ===================================================== */
        const formData = new FormData(form);
        const data = {};
        formData.forEach((value, key) => {
          data[key] = value;
        });

        try {
          const res = await fetch("/registrar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          const text = await res.text();

          if (res.ok) {
            mensaje.textContent = " Registro exitoso. Redirigiendo...";
            mensaje.style.color = "green";
            setTimeout(() => (window.location.href = "/login"), 1500);
          } else {
            mostrarError(text);
          }
        } catch (err) {
          mostrarError("Error de conexión con el servidor.");
        }
      });
    });
  </script>
</head>

<body>
  <div class="form-container">
    <img src="/logo.png" class="logo" />
    <h2>Registro de Usuario</h2>

    <form>
      <input type="text" name="nombre" placeholder="Nombre" required />
      <input type="text" name="apellido" placeholder="Apellido" required />
      <input type="text" name="rut" placeholder="RUT" required />
      <input type="date" name="fechaNacimiento" required />

      <select name="genero" required>
        <option value="">Seleccione género</option>
        <option value="Masculino">Masculino</option>
        <option value="Femenino">Femenino</option>
        <option value="Otro">Otro</option>
      </select>

      <select id="region" name="region" required>
        <option value="">Seleccione región</option>
      </select>

      <select id="comuna" name="comuna" required>
        <option value="">Seleccione comuna</option>
      </select>

      <select id="sector" name="sector" required>
        <option value="">Seleccione sector</option>
      </select>

      <input type="email" name="correo" placeholder="Correo electrónico" required />
      <input type="password" name="contraseña" placeholder="Contraseña" required />

      <label>
        <input type="checkbox" id="tieneNegocio" name="tieneNegocio" /> Tengo un negocio
      </label>

      <div id="negociosContainer" style="display: none;">
        <h3>Datos de los Negocios</h3>
        <button type="button" id="addNegocioBtn" class="btn-secundario">+ Agregar negocio</button>
      </div>

      <button type="submit" class="btn-catalogo">Registrar</button>

      <div class="links">
        <a href="/login">Acceder a mi cuenta</a><br />
        <a href="/olvide-password">¿Olvidaste tu contraseña?</a><br />
      </div>
    </form>
  </div>
</body>
</html>
