<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="/css/login.css">

  <style>
    .error-msg {
      margin-top: 10px;
      padding: 8px;
      background: #ffdddd;
      border-left: 4px solid #ff4444;
      color: #a10000;
      font-size: 14px;
      border-radius: 5px;
      display: none;
      text-align: center;
    }
  </style>

  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.querySelector(".form-login");
      const errorBox = document.getElementById("loginError");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        errorBox.style.display = "none"; // limpiar errores
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        try {
          const res = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
            credentials: "include"
          });

          const result = await res.json();

          // ⚠️ Muestra errores reales
          if (!res.ok) {
            errorBox.textContent = result.error || "Error al iniciar sesión";
            errorBox.style.display = "block";
            return;
          }

          // 🎉 Redirección correcta por rol
          window.location.href = result.redirect || "/catalogo";

        } catch (err) {
          errorBox.textContent = "Error de conexión con el servidor";
          errorBox.style.display = "block";
          console.error(err);
        }
      });
    });
  </script>
</head>

<body>
  <div class="login-wrapper">
    <div class="container">
      <img src="/logo.png" class="logo" />

      <h2>Acceder a mi cuenta</h2>

      <form class="form-login">
        <input type="email" name="correo" placeholder="Correo electrónico" required>
        <input type="password" name="contraseña" placeholder="Contraseña" required>

        <button type="submit" class="btn-catalogo">Ingresar</button>

        <div class="error-msg" id="loginError"></div>

        <div class="extra-links">
          <a href="/olvide-password">¿Olvidaste tu contraseña?</a>
          <a href="/registrar">Crear una cuenta nueva</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
