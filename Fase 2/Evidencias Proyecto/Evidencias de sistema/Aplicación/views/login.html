<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="/css/login.css">
<script defer>
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.querySelector(".form-login");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
          credentials: "include"
        });

        // Validaciones internas (solo consola)
        if (res.status === 404) {
          console.warn("Usuario no encontrado");
          return;
        }

        if (res.status === 401) {
          console.warn("Contraseña incorrecta");
          return;
        }

        if (!res.ok) {
          console.error("Error al iniciar sesión");
          return;
        }

        const result = await res.json();
        console.log("Inicio de sesión exitoso");

        // Redirigir según rol
        setTimeout(() => {
          window.location.href = result.redirect || "/catalogo";
        }, 300);

      } catch (err) {
        console.error("Error de conexión con el servidor:", err);
      }
    });
  });
</script>

</head>

<body>
  <div class="login-wrapper">
    <div class="container">
      <img src="/logo.png" class="logo" />

      <h2>Acceder a mi cuenta</h2>

      <form class="form-login">
        <input type="email" name="correo" placeholder="Correo electrónico" required>
        <input type="password" name="contraseña" placeholder="Contraseña" required>

        <button type="submit" class="btn-catalogo">Ingresar</button>

        <div class="extra-links">
          <a href="/olvide-password">¿Olvidaste tu contraseña?</a>
          <a href="/registrar">Crear una cuenta nueva</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
